limit_req_zone $binary_remote_addr zone=shoplex_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=shoplex_auth:10m rate=5r/m;

upstream shoplex_api_upstream {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name shoplex.com seller.shoplex.com admin.shoplex.com manager.shoplex.com owner.shoplex.com api.shoplex.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.shoplex.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 15M;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none';" always;

    location /api/v1/auth/ {
        limit_req zone=shoplex_auth burst=10 nodelay;
        proxy_pass http://shoplex_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=shoplex_api burst=40 nodelay;
        proxy_pass http://shoplex_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
